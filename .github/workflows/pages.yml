# Tests, builds and deploys the game to GitHub Pages on every push to main (spec §9).
# The repository's Settings → Pages → Source must be "GitHub Actions".
# CI has no local-assets/, so the deployed game always uses the shipped, code-made art.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the build holds no local art
        run: |
          if grep -rlE "data:image/png|_kb|local-assets/portraits" dist; then
            echo "Local art leaked into the build" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
